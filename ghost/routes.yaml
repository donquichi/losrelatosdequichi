# Public route configuration. Existing episode URLs remain at /{slug}/.
routes:
  /categorias/mitos-rurales/:
    controller: channel
    filter: tag:mitos-rurales
    template: category-mitos-rurales
  /categorias/objetos-malditos/:
    controller: channel
    filter: tag:objetos-malditos
    template: category-objetos-malditos
  /tienda/:
    template: tienda
  /episodios/:
    controller: channel
    template: episodios

collections:
  /:
    permalink: /{slug}/
    template: index

taxonomies:
  tag: /tag/{slug}/
  author: /author/{slug}/
