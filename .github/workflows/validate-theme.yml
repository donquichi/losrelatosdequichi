name: Validate Ghost theme
on:
  push:
    paths: ['theme/**', 'scripts/**', 'ops/**', '.github/workflows/validate-theme.yml']
  pull_request:
    paths: ['theme/**', 'scripts/**', 'ops/**', '.github/workflows/validate-theme.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npx --yes gscan@5.4.3 theme/V64 --v6
      - run: for script in scripts/*.cjs; do node --check "$script"; done
      - run: for script in ops/*.sh; do bash -n "$script"; done
